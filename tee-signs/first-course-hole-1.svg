<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Tiny Disc Golf — First Course Hole 1</title>
  <desc id="desc">A wooden-framed disc golf tee sign showing First Course Hole 1, Par 3, 100 feet, wide open with no obstacles, mandos, or hazards.</desc>
  <defs>
    <linearGradient id="wood" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#5a3b24"/><stop offset=".5" stop-color="#8b6240"/><stop offset="1" stop-color="#4b311f"/></linearGradient>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#e9e3d6"/></linearGradient>
    <linearGradient id="fairway" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#4f8b4b"/><stop offset="1" stop-color="#79a85b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".28"/></filter>
    <pattern id="grain" width="90" height="34" patternUnits="userSpaceOnUse"><path d="M0 12 C18 2 34 22 55 10 S78 5 90 15" fill="none" stroke="#c08b5b" stroke-width="3" opacity=".24"/><path d="M-10 27 C12 18 30 36 48 24 S78 18 100 29" fill="none" stroke="#2d1c11" stroke-width="2" opacity=".18"/></pattern>
  </defs>

  <rect width="900" height="1200" fill="#d8d0c0"/>
  <rect x="24" y="24" width="852" height="1152" rx="28" fill="url(#wood)" filter="url(#shadow)"/>
  <rect x="48" y="48" width="804" height="1104" rx="18" fill="url(#paper)"/>
  <rect x="24" y="24" width="852" height="1152" rx="28" fill="url(#grain)"/>

  <!-- Header -->
  <rect x="64" y="64" width="772" height="188" rx="14" fill="#173f3a"/>
  <path d="M64 218 C220 155 310 190 420 135 C535 78 665 145 836 90 L836 252 L64 252 Z" fill="#2f6b58" opacity=".7"/>
  <text x="450" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" letter-spacing="6" fill="#b2c957">TINY DISC GOLF</text>
  <text x="450" y="190" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="900" letter-spacing="2" fill="#ffffff">FIRST COURSE</text>
  <text x="450" y="225" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="4" fill="#dce9e3">BEGINNER • HOLE 1</text>

  <!-- Hole number / stats -->
  <rect x="64" y="270" width="245" height="150" rx="14" fill="#173f3a"/>
  <text x="92" y="310" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#b2c957">HOLE</text>
  <text x="92" y="395" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="900" fill="#ffffff">1</text>
  <rect x="327" y="270" width="245" height="150" rx="14" fill="#f8f4e9" stroke="#b7bfbb" stroke-width="3"/>
  <text x="355" y="312" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#66716d">PAR</text>
  <text x="355" y="392" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="900" fill="#173f3a">3</text>
  <rect x="590" y="270" width="246" height="150" rx="14" fill="#f8f4e9" stroke="#b7bfbb" stroke-width="3"/>
  <text x="618" y="312" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#66716d">DISTANCE</text>
  <text x="618" y="382" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="900" fill="#173f3a">100 ft</text>
  <text x="618" y="407" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#66716d">(10 in)</text>

  <!-- Course map -->
  <rect x="64" y="440" width="772" height="530" rx="16" fill="#264d31"/>
  <rect x="82" y="458" width="736" height="494" rx="12" fill="url(#fairway)"/>
  <path d="M82 560 C190 500 270 610 365 535 S560 470 818 560" fill="none" stroke="#8fbc70" stroke-width="70" opacity=".45"/>
  <path d="M82 800 C230 730 315 870 470 785 S690 735 818 815" fill="none" stroke="#6b9c55" stroke-width="80" opacity=".42"/>
  <!-- open-space texture -->
  <g fill="#2f6b58" opacity=".35">
    <circle cx="145" cy="520" r="18"/><circle cx="205" cy="885" r="20"/><circle cx="740" cy="510" r="18"/><circle cx="760" cy="880" r="22"/><circle cx="120" cy="710" r="14"/><circle cx="690" cy="700" r="15"/>
  </g>
  <!-- tee pad -->
  <rect x="350" y="886" width="200" height="48" rx="7" fill="#c9c2b4" stroke="#173f3a" stroke-width="6"/>
  <text x="450" y="968" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" fill="#ffffff">TEE PAD</text>
  <!-- flight line -->
  <path d="M450 880 C450 760 450 650 450 540" fill="none" stroke="#ffffff" stroke-width="9" stroke-dasharray="20 18"/>
  <polygon points="450,500 428,540 472,540" fill="#ffffff"/>
  <!-- basket -->
  <g transform="translate(450 505)">
    <rect x="-5" y="0" width="10" height="80" fill="#173f3a"/>
    <path d="M-45 78 L45 78 L30 105 L-30 105 Z" fill="#e7c34e" stroke="#173f3a" stroke-width="5"/>
    <path d="M-42 80 L-58 35 M-22 80 L-30 28 M0 80 L0 24 M22 80 L30 28 M42 80 L58 35" stroke="#173f3a" stroke-width="5"/>
    <ellipse cx="0" cy="22" rx="60" ry="12" fill="#e7c34e" stroke="#173f3a" stroke-width="5"/>
    <path d="M-48 22 Q0 -2 48 22" fill="none" stroke="#173f3a" stroke-width="5"/>
  </g>
  <!-- north arrow -->
  <g transform="translate(760 505)">
    <circle r="42" fill="#f8f4e9" opacity=".92"/>
    <path d="M0 -28 L10 8 L0 2 L-10 8 Z" fill="#173f3a"/>
    <text x="0" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="900" fill="#173f3a">N</text>
  </g>

  <!-- Hole notes -->
  <rect x="64" y="990" width="772" height="120" rx="14" fill="#173f3a"/>
  <text x="94" y="1030" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="900" letter-spacing="2" fill="#b2c957">SHOT SHAPE</text>
  <text x="94" y="1070" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#ffffff">WIDE OPEN</text>
  <text x="94" y="1098" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#dce9e3">No obstacles • No mandos • No hazards</text>
  <text x="802" y="1070" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#b2c957">START HERE</text>

  <!-- hardware -->
  <g fill="#252525" stroke="#a9a9a9" stroke-width="2">
    <circle cx="38" cy="38" r="10"/><circle cx="862" cy="38" r="10"/><circle cx="38" cy="1162" r="10"/><circle cx="862" cy="1162" r="10"/>
  </g>
</svg>