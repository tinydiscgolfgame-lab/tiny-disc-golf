name: Deploy Tiny Disc Golf to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Rules Distance Limit table formatting
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          table = """Power\tPutter (Speed 1-3)\tMidrange (Speed 4-6)\tFairway (Speed 7-9)\tDriver (Speed 10-14)
0 to 5\t75\t100\t0\t0
6 to 10\t125\t150\t175\t200
11 to 15\t225\t250\t275\t300
16 to 20\t325\t350\t375\t400
21 to 25\t425\t450\t475\t500
26 to 30\t525\t550\t575\t600
31 to 35\t625\t650\t675\t700
36 to 40\t725\t750\t775\t800
41 to 45\t825\t850\t875\t900
46 to 50\t925\t950\t975\t100"""
          anchor = "There are limits to distances you can throw"
          anchor_pos = s.find(anchor)
          if anchor_pos == -1:
              raise SystemExit('Distance Limit section not found.')
          start = s.find('Power', anchor_pos)
          end = s.find('\n\nCONTROL', start)
          if start == -1 or end == -1:
              raise SystemExit(f'Distance Limit table boundaries not found: start={start}, end={end}')
          s = s[:start] + table + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
