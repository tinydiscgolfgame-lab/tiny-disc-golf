name: Deploy Tiny Disc Golf to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply Modifiers feature
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'data-tab="modifiers"' not in s:
              css='''.quick-modifiers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.quick-modifier{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 8px;background:var(--surface);color:var(--ink);font-weight:800;text-align:left}.quick-modifier.active{background:var(--green);color:#fff;border-color:var(--green)}.quick-modifier small{display:block;font-weight:650;opacity:.82;margin-top:2px}.modifier-section{margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}.modifier-section h3{margin:0 0 8px;font-size:.95rem}.modifier-card-list{display:grid;gap:8px}.modifier-card{border:1px solid var(--line);border-radius:13px;padding:11px;background:var(--surface)}.modifier-card strong{display:block;margin-bottom:3px}.modifier-card span{display:block;color:var(--muted);font-size:.82rem;line-height:1.4}.roll-modifier-summary{margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:.85rem}.roll-modifier-summary strong{color:var(--green2)}.roll-outcome{text-align:center;font-weight:900;font-size:.95rem;margin:8px 0;min-height:1.2em}'''
              s=s.replace('</style>',css+'</style>',1)
              if 'data-tab="tdga">TDGA</button></div>' in s:
                  s=s.replace('data-tab="tdga">TDGA</button></div>','data-tab="tdga">TDGA</button><button class="tab" data-tab="modifiers">Modifiers</button></div>',1)
                  s=s.replace('.tabs{display:grid;grid-template-columns:repeat(9,1fr)','.tabs{display:grid;grid-template-columns:repeat(10,1fr)',1)
              elif 'data-tab="distance">Distance</button></div>' in s:
                  s=s.replace('data-tab="distance">Distance</button></div>','data-tab="distance">Distance</button><button class="tab" data-tab="modifiers">Modifiers</button></div>',1)
                  s=s.replace('.tabs{display:grid;grid-template-columns:repeat(6,1fr)','.tabs{display:grid;grid-template-columns:repeat(7,1fr)',1)
              marker='<div id="modifierList" class="modifier-list"></div><button class="secondary" id="addModifier">+ Add Modifier</button>'
              replacement='<div class="roll-modifier-summary">Tap a modifier to turn it on or off. These clickable options apply their Control/Success Roll effect to the Final Value. Distance and Power effects are shown on the Modifiers tab.</div><div id="quickModifiers" class="quick-modifiers"></div><div id="modifierList" class="modifier-list"></div><button class="secondary" id="addModifier">+ Add Numeric Modifier</button>'
              s=s.replace(marker,replacement,1)
              s=s.replace('<div class="big" id="number">—</div><button','<div class="big" id="number">—</div><div class="roll-outcome" id="rollOutcome"></div><button',1)
              modifiers='''<section id="modifiers" class="panel"><div class="tool"><h3>Modifiers</h3><p class="note">Use these modifiers when determining a throw or putt. When a modifier has a Control effect, its clickable option on the 1–100 tab applies that percentage as percentage points to the Final Value. Power and Distance effects are shown for reference.</p><div class="modifier-section"><h3>Special Rolls</h3><div class="modifier-card-list"><div class="modifier-card"><strong>Success Roll of 1 — Spectacular Success!</strong><span>If a Success Roll ever comes up as a 1, the disc goes directly into the basket as long as the Player can throw that far. This can be an Ace off the tee or a “Field Ace” from the fairway.</span></div><div class="modifier-card"><strong>Success Roll of 100 (00) — Complete Failure!</strong><span>The attempt was a complete failure and the result is twice as bad as usual. Find out how far off the throw or putt spit-out was and multiply that result by 2.</span></div></div></div><div class="modifier-section"><h3>Throwing &amp; Shot Shape</h3><div class="modifier-card-list"><div class="modifier-card"><strong>Throwing for More Power — −10% Control</strong><span>+10% to possible Distance, but sacrifices −10% to Control.</span></div><div class="modifier-card"><strong>Throwing for More Control — +10% Control</strong><span>+10% to Control Success Roll, but sacrifices −10% of possible Distance.</span></div><div class="modifier-card"><strong>Non-dominant BH vs FH — −10% Power / Control</strong><span>−10% to Power and −10% to Control.</span></div><div class="modifier-card"><strong>Opposite Hand — −40% Power / Control</strong><span>−40% to Power and −40% to Control.</span></div><div class="modifier-card"><strong>Extra Hyzer or Anhyzer — −10%</strong><span>−10% to the attempt.</span></div><div class="modifier-card"><strong>Hyzer Flip — −15% Control / +10% Distance</strong><span>−15% to the attempt, but adds 10% to Distance.</span></div><div class="modifier-card"><strong>Flex Turnover — −20%</strong><span>−20% to the attempt.</span></div><div class="modifier-card"><strong>Spike Hyzer, Tomahawk or Thumber — −20%</strong><span>−20% to the attempt, but can go over tall obstacles.</span></div><div class="modifier-card"><strong>Roller — −25% Control / +20% Distance</strong><span>−25% to Control, but adds +20% to Distance.</span></div></div></div><div class="modifier-section"><h3>Obstacles</h3><div class="modifier-card-list"><div class="modifier-card"><strong>Small Tree / Boulder / Obstacle — −10% each</strong><span>Apply −10% for each obstacle in the way.</span></div><div class="modifier-card"><strong>Large Tree / Boulder / Obstacle — −20% to −40% each</strong><span>Choose the penalty based on how much the obstacle blocks the throwing lane.</span></div><div class="modifier-card"><strong>Mando — −10%</strong><span>Single Mando.</span></div><div class="modifier-card"><strong>Double Mando — −20%</strong><span>Double Mando.</span></div><div class="modifier-card"><strong>Triple Mando — −30%</strong><span>Triple Mando.</span></div><div class="modifier-card"><strong>Elevated Basket up to 10 feet — −10%</strong><span>Penalty for an elevated basket up to 10 feet.</span></div><div class="modifier-card"><strong>Elevated Basket up to 20 feet — −20%</strong><span>Penalty for an elevated basket up to 20 feet.</span></div><div class="modifier-card"><strong>Small Water Hazard — −10%</strong><span>Penalty for a small water hazard.</span></div><div class="modifier-card"><strong>Medium Water Hazard — −20%</strong><span>Penalty for a medium water hazard.</span></div><div class="modifier-card"><strong>Big Water Hazard — −30%</strong><span>Penalty for a big water hazard.</span></div><div class="modifier-card"><strong>OB Line Nearby — −10%</strong><span>Penalty when an OB line is nearby.</span></div></div></div><div class="modifier-section"><h3>Course Conditions &amp; Circumstances</h3><div class="modifier-card-list"><div class="modifier-card"><strong>Windy — −5% to −50%</strong><span>Choose the penalty based on wind strength.</span></div><div class="modifier-card"><strong>Rain — −5% to −50%</strong><span>Choose the penalty based on rain intensity.</span></div><div class="modifier-card"><strong>Snow — −10% to −80%</strong><span>Choose the penalty based on snow and footing conditions.</span></div><div class="modifier-card"><strong>Brightness to Darkness — −5% to −50%</strong><span>Choose the penalty based on visibility.</span></div><div class="modifier-card"><strong>Slippery — −5% to −50%</strong><span>Choose the penalty based on footing and grip.</span></div><div class="modifier-card"><strong>Perfect Conditions — +5% to +25%</strong><span>Choose the bonus for ideal conditions.</span></div><div class="modifier-card"><strong>Home Course — +15%</strong><span>Bonus for course familiarity.</span></div><div class="modifier-card"><strong>Big Tourney — −15%</strong><span>Penalty for tournament pressure.</span></div><div class="modifier-card"><strong>First Time Playing a Course — −10%</strong><span>Penalty for unfamiliarity.</span></div><div class="modifier-card"><strong>First Time Legendary Course — −20%</strong><span>Penalty for unfamiliarity and pressure.</span></div><div class="modifier-card"><strong>Legendary Course — −10%</strong><span>Penalty for legendary-course difficulty and pressure.</span></div></div></div><p class="note">For modifiers with a range, the clickable option uses the mildest value shown. Use the numeric modifier control on the 1–100 tab to increase or decrease that amount for the actual conditions.</p></div></section>'''
              s=s.replace('<section id="courses" class="panel">',modifiers+'<section id="courses" class="panel">',1)
              defs='''const clickableModifiers=[{id:'more-power',label:'More Power',short:'−10 Roll',value:-10},{id:'more-control',label:'More Control',short:'+10 Roll',value:10},{id:'non-dominant-style',label:'Non-dominant BH vs FH',short:'−10',value:-10},{id:'opposite-hand',label:'Opposite Hand',short:'−40',value:-40},{id:'extra-hyzer-anhyzer',label:'Extra Hyzer / Anhyzer',short:'−10',value:-10},{id:'hyzer-flip',label:'Hyzer Flip',short:'−15 Roll',value:-15},{id:'flex-turnover',label:'Flex Turnover',short:'−20',value:-20},{id:'spike-tomahawk-thumber',label:'Spike / Tomahawk / Thumber',short:'−20',value:-20},{id:'roller',label:'Roller',short:'−25 Roll',value:-25},{id:'small-obstacle',label:'Small Obstacle',short:'−10 each',value:-10},{id:'large-obstacle',label:'Large Obstacle',short:'−20 to −40',value:-20},{id:'mando',label:'Mando',short:'−10',value:-10},{id:'double-mando',label:'Double Mando',short:'−20',value:-20},{id:'triple-mando',label:'Triple Mando',short:'−30',value:-30},{id:'elevated-10',label:'Elevated Basket ≤10 ft',short:'−10',value:-10},{id:'elevated-20',label:'Elevated Basket ≤20 ft',short:'−20',value:-20},{id:'small-water',label:'Small Water Hazard',short:'−10',value:-10},{id:'medium-water',label:'Medium Water Hazard',short:'−20',value:-20},{id:'big-water',label:'Big Water Hazard',short:'−30',value:-30},{id:'ob-nearby',label:'OB Line Nearby',short:'−10',value:-10},{id:'windy',label:'Windy',short:'−5',value:-5},{id:'rain',label:'Rain',short:'−5',value:-5},{id:'snow',label:'Snow',short:'−10',value:-10},{id:'darkness',label:'Brightness to Darkness',short:'−5',value:-5},{id:'slippery',label:'Slippery',short:'−5',value:-5},{id:'perfect',label:'Perfect Conditions',short:'+5',value:5},{id:'home-course',label:'Home Course',short:'+15',value:15},{id:'big-tourney',label:'Big Tourney',short:'−15',value:-15},{id:'first-course',label:'First Time Playing Course',short:'−10',value:-10},{id:'first-legendary',label:'First Time Legendary Course',short:'−20',value:-20},{id:'legendary',label:'Legendary Course',short:'−10',value:-10}];let activeQuickModifiers=new Set();function renderQuickModifiers(){const box=$('#quickModifiers');if(!box)return;box.innerHTML='';clickableModifiers.forEach(m=>{const b=document.createElement('button');b.type='button';b.className='quick-modifier'+(activeQuickModifiers.has(m.id)?' active':'');b.innerHTML=escapeDistanceHtml(m.label)+'<small>'+escapeDistanceHtml(m.short)+'</small>';b.addEventListener('click',()=>{if(activeQuickModifiers.has(m.id))activeQuickModifiers.delete(m.id);else activeQuickModifiers.add(m.id);renderQuickModifiers();updateCalc()});box.appendChild(b)})}function getQuickModifierTotal(){return clickableModifiers.filter(m=>activeQuickModifiers.has(m.id)).reduce((sum,m)=>sum+m.value,0)}\n'''
              s=s.replace('function init(){',defs+'function init(){',1)
              s=s.replace('let total=currentRoll;','let total=currentRoll+getQuickModifierTotal();',1)
              s=s.replace("$('#resetCalc').addEventListener('click',()=>{$('#modifierList').innerHTML='';addModifierRow()});","$('#resetCalc').addEventListener('click',()=>{$('#modifierList').innerHTML='';addModifierRow();activeQuickModifiers.clear();renderQuickModifiers();updateCalc()});",1)
              s=s.replace("$('#rolls').textContent=rollHistory.join(' • ');$('#finalHistory').textContent=finalHistory.length?finalHistory.join(' • '):'—';updateCalc();","$('#rolls').textContent=rollHistory.join(' • ');$('#finalHistory').textContent=finalHistory.length?finalHistory.join(' • '):'—';updateCalc();const outcome=$('#rollOutcome');if(outcome)outcome.textContent=currentRoll===1?'ACE / FIELD ACE! — spectacular success!':(currentRoll===100?'COMPLETE FAILURE! — determine the normal miss and double it.':'');",1)
              s=s.replace('  addModifierRow();\n\n  const dirs=', '  addModifierRow();\n  renderQuickModifiers();\n\n  const dirs=',1)
              p.write_text(s,encoding='utf-8')
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then echo "No app patch needed"; else git add index.html && git commit -m "Add Modifiers tab and clickable roll modifiers" && git push; fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
