name: Install Four TDG Courses
on:
  push:
    paths:
      - '.github/workflows/add-four-courses.yml'
permissions:
  contents: write
jobs:
  install-courses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add courses to index.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if "id:'builtin-tdg-middle-school'" in s:
              print('Courses already installed; nothing to do.')
              raise SystemExit(0)
          marker="const tdgElementaryCourse={"
          insert="""const tdgMiddleSchoolCourse={id:'builtin-tdg-middle-school',name:'TDG Middle School',description:'Welcome to TDG Middle School! This beginner-to-intermediate course is where Tiny Disc Golf starts demanding more than simply making a clean throw. Expect tighter lines, moderate hazards, changing elevations, and a few holes that reward smart shot selection. Signature Hole 7 features a split fairway: the safe route is longer and open, while the shorter route threads between trees for a big risk-reward opportunity. If a Player throws TDG Middle School under par, they gain Rating Points and, the first time only, 4 Stat Points to upgrade their stats plus a School Spirit Wristband accessory that adds +5% to Control Success Rolls on wooded holes.',holes:9,pars:[3,3,3,3,3,3,4,3,4],distances:['240 ft (24 in)','285 ft (28.5 in)','310 ft (31 in)','220 ft (22 in)','330 ft (33 in)','260 ft (26 in)','420 ft (42 in)','300 ft (30 in)','450 ft (45 in)'],shotShapes:['Straight through a 25 ft (2.5 in) wide fairway; two trees guard the basket (−10% modifier).','Gentle downhill hyzer with scattered trees on the right; −10% modifier until C2 (6.6 in).','Flat turnover around a wooded corner; OB sidewalk 15 ft (1.5 in) left of the fairway adds −15% modifier.','Short downhill ace-run to a small island; −20% modifier. If the disc misses the island, take 1 penalty stroke and throw from the DZ.','Long straight drive with a low ceiling for the final 100 ft (10 in); −10% modifier.','Uphill tunnel shot with a 20 ft (2 in) wide landing zone; −20% modifier until C1 (3.3 in).','SIGNATURE HOLE — Split fairway. Safe left route is 470 ft (47 in) with no modifier; aggressive right route is 420 ft (42 in) through a 12 ft (1.2 in) gap with −30% modifier. Choose your line before throwing.','Water carry of 70 ft (7 in) to a peninsula basket; −20% modifier. If the disc lands in water, take 1 penalty stroke and throw from the near DZ.','Uphill finishing hole with trees around the basket; −15% modifier until C1 (3.3 in).']};
const tdgHighSchoolCourse={id:'builtin-tdg-high-school',name:'TDG High School',description:'Welcome to TDG High School! This intermediate-level course expects Players to control distance, shape multiple shot types, and recover when a perfect line is not available. Fairways become narrower, hazards matter more, and several holes reward a confident commitment to the correct line. Signature Hole 5 is the Gymnasium Gap, a long drive that must clear a narrow corridor before opening into a scoring green. If a Player throws TDG High School under par, they gain Rating Points and, the first time only, 4 Stat Points plus a Varsity Disc Towel accessory that adds +5% to Success Rolls on drives for the entire next round.',holes:9,pars:[3,3,4,3,4,4,3,4,5],distances:['325 ft (32.5 in)','360 ft (36 in)','510 ft (51 in)','280 ft (28 in)','475 ft (47.5 in)','540 ft (54 in)','390 ft (39 in)','610 ft (61 in)','720 ft (72 in)'],shotShapes:['Triple Mando created by three mature trees; −30% modifier.','Long downhill hyzer with OB road 20 ft (2 in) beyond the right edge; −15% modifier.','Par 4 dogleg left around a wooded corner; −20% modifier on the drive, then open to the basket.','Elevated tee to a C1 island; −25% modifier until the disc is within C1. Missed island adds 1 penalty stroke and uses the DZ.','SIGNATURE HOLE — The Gymnasium Gap. Drive through a 15 ft (1.5 in) wide tree corridor for 275 ft (27.5 in), then the fairway opens for 200 ft (20 in). The gap imposes −30% on the drive only.','Par 4 with a creek crossing the fairway at 330 ft (33 in); −20% modifier until the Player reaches the far side. A disc in the creek adds 1 penalty stroke and uses the nearest safe lie.','390 ft sweeping turnover with a steep drop behind the basket; −10% modifier. A disc beyond the cliff line takes 1 penalty stroke.','Par 4 with two landing zones: a tight 280 ft (28 in) route through trees (−25%) or a wide 340 ft (34 in) route that adds 60 ft (6 in) to the effective distance but only −10%.','Par 5 championship-style closer: 430 ft (43 in) drive, then 290 ft (29 in) uphill to a guarded basket; −20% modifier on the final approach.']};
const tdgUniversityCourse={id:'builtin-tdg-university',name:'TDG University',description:'Welcome to TDG University! This advanced course is built for Players who have mastered the fundamentals and are ready to manage complex decisions under pressure. Long par 4s, technical par 3s, elevation changes, penalty hazards, and multiple scoring lines demand a complete game. Signature Hole 6 is the Quadruple Threat: four distinct routes attack the same basket, each trading distance, accuracy, and modifier risk differently. If a Player throws TDG University under par, they gain Rating Points and, the first time only, 4 Stat Points plus a Dean’s Choice Driver accessory that ignores one −10% or −15% modifier each round.',holes:9,pars:[3,4,4,3,5,4,4,5,5],distances:['410 ft (41 in)','575 ft (57.5 in)','640 ft (64 in)','350 ft (35 in)','800 ft (80 in)','525 ft (52.5 in)','690 ft (69 in)','900 ft (90 in)','980 ft (98 in)'],shotShapes:['Tight 25 ft (2.5 in) fairway with overhanging branches; −30% modifier.','Par 4 with a 90 ft (9 in) downhill drop and a guarded green; plays like 485 ft (48.5 in) but the landing zone is −20%.','Par 4 forced turnover around a wooded peninsula; −25% modifier until C2.','Long downhill tee shot to a 50 ft (5 in) island green; −30% modifier. Missed island adds 1 penalty stroke and uses the DZ.','Par 5 with an OB creek crossing twice. First crossing at 360 ft (36 in), second at 650 ft (65 in); −15% modifier on each crossing zone.','SIGNATURE HOLE — The Quadruple Threat. Choose one of four routes: 525 ft (52.5 in) wide hyzer (−15%), 470 ft (47 in) tunnel (−35%), 560 ft (56 in) turnover around OB (−20%), or 430 ft (43 in) roller lane (−40%). The chosen route determines the modifier for the drive.','690 ft uphill par 4 with a 30 ft (3 in) ceiling for the final 180 ft (18 in); −25% modifier on the final throw.','Par 5 with a 100 ft (10 in) water carry and a steep uphill finish; −20% modifier on the water carry and −15% on the final approach.','980 ft finishing par 5 with a narrow landing zone at 450 ft (45 in), then a downhill approach to a basket on a ridge; −30% modifier on the tee shot and −20% on the final approach.']};
const tdgWorldChampionCourse={id:'builtin-tdg-world-champion',name:'TDG World Champion',description:'Welcome to TDG World Champion! This pro-level course is designed to feel like the final stage of a world championship: enormous power is useful, but precision, angle control, risk management, and putting under pressure are what separate a great round from a legendary one. Every hole has a meaningful decision, and several punish even small misses. Signature Hole 9 is the World Champion Finish, a massive par 5 that combines a championship landing zone, a forced carry, and a protected ridge-top basket. If a Player throws TDG World Champion under par, they gain Rating Points and, the first time only, 4 Stat Points plus the World Champion Disc: a driver that adds +25 ft (2.5 in) to Distance on tee shots and allows the Player to ignore one hole modifier per round.',holes:9,pars:[4,4,5,3,5,4,5,4,5],distances:['620 ft (62 in)','720 ft (72 in)','950 ft (95 in)','410 ft (41 in)','1050 ft (105 in)','680 ft (68 in)','1150 ft (115 in)','760 ft (76 in)','1250 ft (125 in)'],shotShapes:['Championship tunnel drive with a 20 ft (2 in) fairway; −35% modifier until the landing zone.','Massive downhill bomber with OB left and a protected green; −20% modifier on the drive and −15% at the basket.','Par 5 with a 300 ft (30 in) forced carry over water; −30% modifier on the carry. A water miss adds 1 penalty stroke and uses the DZ.','Elevated tee to a 60 ft (6 in) diameter island; −40% modifier. Missed island adds 1 penalty stroke and requires a retee.','Par 5 with a split landing zone: aggressive 450 ft (45 in) carry over a ravine at −35%, or conservative 380 ft (38 in) route with −15% and an additional 100 ft (10 in) to the basket.','SIGNATURE HOLE — The World Champion Gauntlet. A 680 ft (68 in) par 4 with three consecutive landing windows: first 250 ft (25 in) at −20%, second 220 ft (22 in) through a Triple Mando at −30%, then a 210 ft (21 in) guarded finish at −25%. A Player who clears all three windows cleanly has a true championship line.','Par 5 measuring 1150 ft (115 in), with a 450 ft (45 in) landing zone surrounded by OB; −25% modifier on the drive. Final 300 ft (30 in) is uphill and −20%.','760 ft par 4 with a sweeping turnover over an OB slope; −30% modifier until the Player reaches C2, then −20% to the basket.','WORLD CHAMPION FINISH — 1250 ft par 5. Drive 550 ft (55 in) to a narrow 40 ft (4 in) landing zone (−25%), cross a 180 ft (18 in) forced water carry (−35%), then climb 520 ft (52 in) to a ridge-top basket protected by trees (−30%). A water miss adds 1 penalty stroke and uses the DZ.']};
"""
          if marker not in s:
              raise SystemExit('Course insertion marker not found')
          s=s.replace(marker,insert+marker,1)
          old="savedCourses=savedCourses.filter(c=>c.id!=='builtin-18'&&c.id!=='builtin-first-course'&&c.id!=='builtin-everyones-favorite-local'&&c.id!=='builtin-legendary-local').map(c=>c.id==='builtin-9'?{...c,name:'TDG Elementary'}:c);savedCourses.unshift(legendaryLocalCourse);savedCourses.unshift(favoriteLocalCourse);savedCourses.unshift(firstCourse);localStorage.setItem('tinyCourses',JSON.stringify(savedCourses));"
          new="savedCourses=savedCourses.filter(c=>c.id!=='builtin-18'&&c.id!=='builtin-first-course'&&c.id!=='builtin-everyones-favorite-local'&&c.id!=='builtin-legendary-local'&&c.id!=='builtin-tdg-middle-school'&&c.id!=='builtin-tdg-high-school'&&c.id!=='builtin-tdg-university'&&c.id!=='builtin-tdg-world-champion').map(c=>c.id==='builtin-9'?{...c,name:'TDG Elementary'}:c);savedCourses.unshift(tdgWorldChampionCourse);savedCourses.unshift(tdgUniversityCourse);savedCourses.unshift(tdgHighSchoolCourse);savedCourses.unshift(tdgMiddleSchoolCourse);savedCourses.unshift(legendaryLocalCourse);savedCourses.unshift(favoriteLocalCourse);savedCourses.unshift(firstCourse);localStorage.setItem('tinyCourses',JSON.stringify(savedCourses));"
          if old not in s:
              raise SystemExit('Course save/unshift marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit course changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add four new TDG courses'
          git push
# Trigger installer after initial workflow creation