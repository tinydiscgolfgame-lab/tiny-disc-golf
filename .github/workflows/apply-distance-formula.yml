name: Apply Distance Formula
on:
  push:
    paths-ignore:
      - '.github/workflows/**'
      - 'distance-update-trigger.txt'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update distance calculator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          new_fn='''function renderDistanceCalculator(){
            const powerEl=document.querySelector('[data-key="power"]');
            const power=Number(powerEl?.value);
            const powerDisplay=$('#distancePower'),rows=$('#distanceRows');
            if(!powerDisplay||!rows)return;
            const validPower=Number.isFinite(power)&&powerEl.value!=='';
            powerDisplay.textContent=validPower?String(power):'—';
            rows.innerHTML='';
            const discs=Array.from($('#bag').querySelectorAll(':scope > .disc-row'));
            const active=discs.filter(r=>Array.from(r.querySelectorAll('input')).some(x=>x.value.trim()!==''));
            if(!active.length){
              const tr=document.createElement('tr');
              tr.innerHTML='<td colspan="5" class="note" style="text-align:center">Add a disc to the Bag to calculate its distance.</td>';
              rows.appendChild(tr);return;
            }
            active.forEach(r=>{
              const inputs=Array.from(r.querySelectorAll('input'));
              const name=inputs[0]?.value.trim()||'Unnamed Disc';
              const speed=Number(inputs[1]?.value);
              const glide=Number(inputs[2]?.value);
              const speedEntered=inputs[1]?.value.trim()!=='';
              const glideEntered=inputs[2]?.value.trim()!=='';
              const type=speedEntered&&Number.isFinite(speed)?getDiscType(speed):null;
              const base=validPower&&type?getDistanceLimit(power,type.key):null;
              const validGlide=glideEntered&&Number.isFinite(glide);
              let tee='—',field='—';
              let resultClass='distance-result';
              if(!speedEntered){tee=field='Enter Speed';resultClass='cannot-throw'}
              else if(!type){tee=field='Speed must be 1–14';resultClass='cannot-throw'}
              else if(!validPower){tee=field='Enter Power'}
              else if(base===null){tee=field='Power outside chart';resultClass='cannot-throw'}
              else if(!validGlide){tee=field=base+' ft base'}
              else{tee=(base+glide*10)+' ft';field=(base+glide*5)+' ft'}
              const breakdown=validPower&&type&&base!==null
                ?'<div class="distance-breakdown">Power × 20 component: '+base+' ft'+(validGlide?' • Drive + '+glide+' × 10 • Field + '+glide+' × 5':'')+'</div>':'';
              const tr=document.createElement('tr');
              tr.innerHTML='<td>'+escapeDistanceHtml(name)+'</td><td>'+(speedEntered?escapeDistanceHtml(inputs[1].value):'—')+'</td><td>'+(type?type.name:'—')+'</td><td class="'+resultClass+'">'+escapeDistanceHtml(tee)+(breakdown?breakdown:'')+'</td><td class="'+resultClass+'">'+escapeDistanceHtml(field)+'</td>';
              rows.appendChild(tr);
            });
          }
          '''
          s=re.sub(r'function renderDistanceCalculator\(\)\{.*?\n\}\nfunction escapeDistanceHtml',new_fn+'function escapeDistanceHtml',s,count=1,flags=re.S)
          s=s.replace('<th>Disc</th><th>Speed</th><th>Type</th><th>Maximum Distance</th>','<th>Disc</th><th>Speed</th><th>Type</th><th>Drive off Tee</th><th>Throw from Field</th>')
          s=s.replace('Each disc\'s maximum distance is determined by the Current Player\'s Power and the disc\'s Speed range. Speed 1–3 = Putter, 4–6 = Midrange, 7–9 = Fairway, and 10–14 = Driver.','The Distance Limit Chart supplies the Power × 20 portion of the equation. Glide is then added separately: Glide × 10 for drives off the tee and Glide × 5 for throws from the field. Speed 1–3 = Putter, 4–6 = Midrange, 7–9 = Fairway, and 10–14 = Driver.')
          s=s.replace('<p class="note">The Distance Limit Chart uses the player\'s Power band and the disc\'s Speed category. Power above 50 is outside the chart.</p>','<p class="note">The chart value is the Power × 20 component only. The final distance shown for each disc adds Glide × 10 for a drive or Glide × 5 for a field throw. Power above 50 is outside the chart.</p>')
          p.write_text(s)
          PY
          if git diff --quiet -- index.html; then
            echo 'No distance changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix distance formula to add Glide component'
          git push
