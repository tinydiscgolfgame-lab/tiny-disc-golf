name: Tiny Disc Golf Source Updates

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update TDG Elementary course
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_pattern = re.compile(r"\{id:'builtin-9',name:'The Quick 9',holes:9,pars:\[3,3,3,3,3,3,3,3,3\],distances:\['200 ft','225 ft','250 ft','180 ft','275 ft','210 ft','300 ft','240 ft','260 ft'\],shotShapes:\['Straight with gentle fade','Hyzer left around trees','Controlled turnover right','Straight tunnel shot','Open fairway hyzer','Low straight shot','Distance drive with stable finish','Uphill straight with fade','Finishing hyzer toward basket'\]\}")
          new_course = "{id:'builtin-9',name:'TDG Elementary',description:'Welcome to TDG Elementary! This beginner-friendly 9-hole course is a great place to learn the basics of Tiny Disc Golf, practice your skills, and build confidence before taking on tougher courses. Watch the hole modifiers as you play, and have fun working your way around the course!',holes:9,pars:[3,3,3,3,3,3,3,3,3],distances:['200 ft','225 ft','250 ft','180 ft','275 ft','210 ft','300 ft','240 ft','260 ft'],shotShapes:['Straight with gentle fade (+10%)','Hyzer left around trees (-10%)','Controlled turnover right (-10%)','Straight tunnel shot (-20%)','Open fairway hyzer','Low straight shot (-10%)','Distance drive with stable finish','Uphill straight with fade','Finishing hyzer toward basket'] }"

          if old_pattern.search(s):
              s = old_pattern.sub(new_course, s, count=1)
          elif "name:'TDG Elementary'" not in s:
              raise SystemExit('Could not find The Quick 9 course definition.')

          marker = "if(!savedCourses.length){"
          migration = """const tdgElementaryCourse={id:'builtin-9',name:'TDG Elementary',description:'Welcome to TDG Elementary! This beginner-friendly 9-hole course is a great place to learn the basics of Tiny Disc Golf, practice your skills, and build confidence before taking on tougher courses. Watch the hole modifiers as you play, and have fun working your way around the course!',holes:9,pars:[3,3,3,3,3,3,3,3,3],distances:['200 ft','225 ft','250 ft','180 ft','275 ft','210 ft','300 ft','240 ft','260 ft'],shotShapes:['Straight with gentle fade (+10%)','Hyzer left around trees (-10%)','Controlled turnover right (-10%)','Straight tunnel shot (-20%)','Open fairway hyzer','Low straight shot (-10%)','Distance drive with stable finish','Uphill straight with fade','Finishing hyzer toward basket']};
          const tdgElementaryIndex=savedCourses.findIndex(c=>c.id==='builtin-9');
          if(tdgElementaryIndex>=0){savedCourses[tdgElementaryIndex]=tdgElementaryCourse;localStorage.setItem('tinyCourses',JSON.stringify(savedCourses));}
          """
          if 'const tdgElementaryCourse=' not in s:
              if marker not in s:
                  raise SystemExit('Could not find saved course initialization marker.')
              s = s.replace(marker, migration + marker, 1)

          s = s.replace("name:'The Quick 9'", "name:'TDG Elementary'")
          p.write_text(s, encoding='utf-8')

      - name: Fix Distance Limit table formatting
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          header = "Power\tPutter\n(Speed 1-3)\tMidrange\n(Speed 4-6)\tFairway\n(Speed 7-9)\tDriver\n(Speed 10-14)"
          table = """Power\tPutter (Speed 1-3)\tMidrange (Speed 4-6)\tFairway (Speed 7-9)\tDriver (Speed 10-14)
0 to 5\t75\t100\t0\t0
6 to 10\t125\t150\t175\t200
11 to 15\t225\t250\t275\t300
16 to 20\t325\t350\t375\t400
21 to 25\t425\t450\t475\t500
26 to 30\t525\t550\t575\t600
31 to 35\t625\t650\t675\t700
36 to 40\t725\t750\t775\t800
41 to 45\t825\t850\t875\t900
46 to 50\t925\t950\t975\t100"""

          if header not in s:
              raise SystemExit('Distance Limit table header not found exactly; no changes made.')

          end_marker = "\n\nTo determine"
          start = s.index(header)
          end = s.find(end_marker, start)
          if end == -1:
              raise SystemExit('Could not locate the end of the Distance Limit table block.')

          s = s[:start] + table + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Commit source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/update-tdg-elementary.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No source changes needed."
          else
            git commit -m "Fix Distance Limit table formatting"
            git push
          fi
