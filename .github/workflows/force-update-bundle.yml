name: Force Update Bundle

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Find and update bundle
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new_text='Everything Needed to Play! Includes Rulebook, Dice, Measuring Tape, Spinning Arrow &amp; Markers AND shipping for only $25! Please add your Name and Address in the comments section.'
          new_url='https://www.paypal.com/qrcodes/p2pqrc/Z7N4C8RZZGU2S'
          m=re.search(r'<section[^>]+id=["\']tdga["\'][\s\S]*?</section>',s,re.I)
          if not m:
              raise SystemExit('TDGA section not found')
          sec=m.group(0)
          bi=re.search(r'Bundle',sec,re.I)
          if not bi:
              raise SystemExit('Bundle text not found in TDGA section')
          print('Bundle context before update:')
          print(re.sub(r'\s+',' ',sec[max(0,bi.start()-800):min(len(sec),bi.start()+2500)]))
          # Replace the first paragraph following the Bundle label.
          tail=sec[bi.end():]
          pm=re.search(r'<p\b[^>]*>[\s\S]*?</p>',tail,re.I)
          if not pm:
              raise SystemExit('Bundle paragraph not found')
          a=bi.end()+pm.start(); b=bi.end()+pm.end()
          sec=sec[:a]+'<p>'+new_text+'</p>'+sec[b:]
          # Replace the first href/onclick link after the Bundle label.
          tail=sec[bi.end():]
          lm=re.search(r'<(?:a|button)\b[^>]*(?:href|onclick)=["\'][^"\']*["\'][^>]*>',tail,re.I)
          if not lm:
              raise SystemExit('Bundle button/link not found')
          tag=lm.group(0)
          newtag=re.sub(r'(href|onclick)=["\'][^"\']*["\']',lambda x:x.group(1)+'="'+new_url+'"',tag,count=1,flags=re.I)
          sec=sec[:bi.end()+lm.start()]+newtag+sec[bi.end()+lm.end():]
          s=s[:m.start()]+sec+s[m.end():]
          p.write_text(s,encoding='utf-8')
          print('Bundle updated.')
      - name: Verify
        run: |
          grep -F 'Everything Needed to Play! Includes Rulebook, Dice, Measuring Tape, Spinning Arrow &amp; Markers AND shipping for only $25! Please add your Name and Address in the comments section.' index.html
          grep -F 'https://www.paypal.com/qrcodes/p2pqrc/Z7N4C8RZZGU2S' index.html
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then echo "No changes needed"; else git add index.html && git commit -m "Apply TDGA Bundle update" && git push; fi
