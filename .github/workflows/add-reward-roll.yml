name: Add Reward Roll tab
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Reward Roll tab
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<button class="tab" data-tab="tdga">TDGA</button>'
          new='<button class="tab" data-tab="reward">Reward Roll</button>'+old
          if 'data-tab="reward"' not in s:
              s=s.replace(old,new,1)
          old_section='<section id="direction" class="panel">'
          reward_section='''<section id="reward" class="panel"><div class="tool"><h3>Reward Rolls</h3><p class="note">In Tiny Disc Golf, when a Player performs a spectacular feat like throwing in an Ace or winning a League or Tournament, then you have the chance to earn a random Reward from the Reward Roll Chart below. As with Success Rolls, a lower roll being better and wins the Player the best benefit!</p><button class="primary" id="rewardRoll">ROLL REWARD 1–100</button><div class="big" id="rewardNumber">—</div><div class="result" id="rewardResult">Roll to discover your Reward.</div><div class="calc" style="margin-top:18px"><h3>Reward Roll Chart</h3><div class="distance-table-wrap"><table class="distance-table"><thead><tr><th>Roll</th><th>Reward</th></tr></thead><tbody id="rewardTable"></tbody></table></div></div><div class="calc" style="margin-top:18px"><h3>Special Abilities (SA) Discs</h3><p class="note">If you were rewarded a SA Disc from your Reward Roll, choose the mold of disc you want and then roll once again to determine the type of Special Ability that disc has. If your Putting is atrocious, you might want a SA Putter; if your Driving is subpar, you might choose a Driver and then roll to see how that disc has been changed to help your game!</p><button class="secondary" id="saRoll" type="button">ROLL SA DISC 1–100</button><div class="big" id="saNumber">—</div><div class="result" id="saResult">SA Disc ability roll ready.</div><div class="distance-table-wrap"><table class="distance-table"><thead><tr><th>Roll</th><th>Special Ability Disc</th></tr></thead><tbody id="saTable"></tbody></table></div></div></div></section>'''
          if 'id="reward" class="panel"' not in s:
              s=s.replace(old_section,reward_section+old_section,1)
          reward_js='''
const rewardRolls=[
[1,1,'+2 to all Player Stats, + SA Disc & +15% Accessory'],[2,2,'+2 to all Player Stats'],[3,3,'SA Disc & +15% to Success Rolls Accessory of choice'],[4,5,'SA Disc'],[6,10,'Training Session! +5 to be spread among Player Stats'],[11,15,'Training Session! +5 to be spread among Player Stats'],[16,20,'Training Session! +1 to each Player Stats'],[21,25,'Training Session! +1 to Player Stat of choice'],[26,30,'Cart! +20% to all Success Rolls due to lack of fatigue'],[31,35,'Grip Enhancer! +15% to Success Rolls'],[36,40,'+1 Slot in Bag'],[41,45,'+10% to Success Rolls Accessory of choice'],[46,50,'+5% to Success Rolls Accessory of choice'],[51,55,'Umbrella & DG Gloves! Disregard rain related modifiers'],[56,60,'Lucky Charm! Roll 2 dice at beginning of round. If results are below 10 then the Player has Double Luck Points for that round'],[61,65,'Rangefinder! +15% to all tee shots'],[66,70,'Disc Golf Shoes! +10% to all Success Rolls'],[71,75,'Rating Increases by triple for this round'],[76,80,'Cooler Full of Beverages! Roll 2 dice at beginning of round. If over 50, then the Player has no Luck Points for that round, but if under then Luck Points are double that round'],[81,85,'Almost There! Just not enough to be noticed'],[86,90,'False Plateau! Thought Player made gains, but you didn’t'],[91,95,'In your own head! Great victory but Player gains nothing'],[96,96,'Bag Broke! -2 slots in your Bag for the next 5 rounds'],[97,97,'Hard high five from your homie causes a hand injury! -2 to all Player Stats for 5 rounds'],[98,98,'Left on Course! Lost your favorite Accessory for 5 rounds'],[99,99,'Left on Course! Lost your favorite Disc for 5 rounds'],[100,100,'Stolen Bag! You can’t use your usual Bag, Discs and Accessories for 5 rounds and your backup bag only has 6 slots'],[101,101,'Freak injury while celebrating! -2 to all Player Stats for 10 rounds & the Player’s favorite SA Disc is lost forever']
];
const saDiscRolls=[[1,10,'All Modifiers are nullified'],[11,20,'All Course Modifiers are nullified'],[21,30,'All Hole Modifiers are nullified'],[31,40,'All Course Modifiers are nullified'],[41,50,'Power Disc! The Power of this disc does not factor into calculating Success Rolls & +20 feet/2” to all throws'],[51,60,'Control Disc! +25% to all Success Rolls'],[61,70,'Putting Disc! +35% to all Putts'],[71,80,'Lucky Disc! The disc itself has its own Luck equal to the Players Luck Stat that can be spent during a round'],[81,90,'+20% to all Success Rolls'],[91,100,'+10% to all Success Rolls']];
function findReward(n){return rewardRolls.find(x=>n>=x[0]&&n<=x[1]);}
function findSaReward(n){return saDiscRolls.find(x=>n>=x[0]&&n<=x[1]);}
function renderRewardTables(){const r=$('#rewardTable');const s=$('#saTable');if(r){r.innerHTML='';rewardRolls.filter(x=>x[0]<=100).forEach(x=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+ (x[0]===x[1]?x[0]:x[0]+'–'+x[1]) +'</td><td>'+x[2]+'</td>';r.appendChild(tr)})}if(s){s.innerHTML='';saDiscRolls.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+x[0]+'–'+x[1]+'</td><td>'+x[2]+'</td>';s.appendChild(tr)})}}
'''
          marker='const clickableModifiers='
          if 'const rewardRolls=[' not in s:
              s=s.replace(marker,reward_js+marker,1)
          init_marker='  const dirs=['
          init_code='''  renderRewardTables();
  $('#rewardRoll').addEventListener('click',()=>{const n=Math.floor(Math.random()*100)+1;$('#rewardNumber').textContent=n;$('#rewardResult').textContent=findReward(n)?.[2]||'—';});
  $('#saRoll').addEventListener('click',()=>{const n=Math.floor(Math.random()*100)+1;$('#saNumber').textContent=n;$('#saResult').textContent=findSaReward(n)?.[2]||'—';});
'''
          if "$('#rewardRoll').addEventListener" not in s:
              s=s.replace(init_marker,init_code+init_marker,1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-reward-roll.yml
          git add index.html .github/workflows/add-reward-roll.yml
          git commit -m "Add Reward Roll and SA Disc tabs" || exit 0
          git push
