name: One-time Tiny Disc Golf tab update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update tabs and add simple calculator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_tabs = '<div class="tabs"><button class="tab active" data-tab="pass">Player Pass</button><button class="tab" data-tab="random">1–100</button><button class="tab" data-tab="direction">Direction</button><button class="tab" data-tab="rounds">Rounds</button><button class="tab" data-tab="courses">Courses</button><button class="tab" data-tab="distance">Distance</button><button class="tab" data-tab="control">Control</button><button class="tab" data-tab="putting">Putting</button><button class="tab" data-tab="modifiers">Modifiers</button><button class="tab" data-tab="tdga">TDGA</button></div>'
          new_tabs = '<div class="tabs"><button class="tab active" data-tab="pass">Player\'s Pass</button><button class="tab" data-tab="distance">Distance</button><button class="tab" data-tab="control">Control</button><button class="tab" data-tab="putting">Putting</button><button class="tab" data-tab="rounds">Rounds</button><button class="tab" data-tab="courses">Courses</button><button class="tab" data-tab="random">1–100</button><button class="tab" data-tab="direction">Direction</button><button class="tab" data-tab="modifiers">Modifiers</button><button class="tab" data-tab="tdga">TDGA</button></div>'
          if old_tabs not in s:
              raise SystemExit('Expected tab markup was not found')
          s = s.replace(old_tabs, new_tabs, 1)

          old_random = '<div id="modifierList" class="modifier-list"></div><button class="secondary" id="addModifier">+ Add Numeric Modifier</button><div class="calc-final">Final Value: <strong id="finalValue">—</strong></div><button class="secondary" id="resetCalc">Reset Modifiers</button><p class="note">Add as many modifiers as needed. Tap + or − for each modifier, then enter its value.</p></div></div><div class="tool"><h3>Previous 5 Rolls</h3>'
          new_random = '<div id="modifierList" class="modifier-list"></div><button class="secondary" id="addModifier">+ Add Numeric Modifier</button><div class="calc-final">Final Value: <strong id="finalValue">—</strong></div><button class="secondary" id="resetCalc">Reset Modifiers</button><p class="note">Add as many modifiers as needed. Tap + or − for each modifier, then enter its value.</p><div class="calc" style="margin-top:18px"><h3>Simple Calculator</h3><div class="cal"><input class="input" id="simpleCalcA" type="number" inputmode="decimal" placeholder="Number 1"><input class="input" id="simpleCalcB" type="number" inputmode="decimal" placeholder="Number 2"></div><div class="cal" style="margin-top:8px"><button class="secondary" type="button" data-simple-op="add">+</button><button class="secondary" type="button" data-simple-op="subtract">−</button><button class="secondary" type="button" data-simple-op="multiply">×</button><button class="secondary" type="button" data-simple-op="divide">÷</button></div><div class="calc-final">Result: <strong id="simpleCalcResult">—</strong></div><p class="note">Enter two numbers, then choose +, −, ×, or ÷.</p></div></div><div class="tool"><h3>Previous 5 Rolls</h3>'
          if old_random not in s:
              raise SystemExit('Expected 1–100 calculator markup was not found')
          s = s.replace(old_random, new_random, 1)

          old_init = "  $('#resetCalc').addEventListener('click',()=>{$('#modifierList').innerHTML='';addModifierRow();activeQuickModifiers.clear();renderQuickModifiers();updateCalc()});\n  addModifierRow();\n  renderQuickModifiers();"
          new_init = "  $('#resetCalc').addEventListener('click',()=>{$('#modifierList').innerHTML='';addModifierRow();activeQuickModifiers.clear();renderQuickModifiers();updateCalc()});\n  function updateSimpleCalculator(op){\n    const a=Number($('#simpleCalcA').value),b=Number($('#simpleCalcB').value);\n    if(!Number.isFinite(a)||!Number.isFinite(b)){ $('#simpleCalcResult').textContent='—'; return; }\n    let result;\n    if(op==='add')result=a+b;\n    if(op==='subtract')result=a-b;\n    if(op==='multiply')result=a*b;\n    if(op==='divide'){ if(b===0){ $('#simpleCalcResult').textContent='Cannot divide by zero'; return; } result=a/b; }\n    $('#simpleCalcResult').textContent=Number.isInteger(result)?String(result):String(Number(result.toFixed(4)));\n  }\n  $$('[data-simple-op]').forEach(btn=>btn.addEventListener('click',()=>updateSimpleCalculator(btn.dataset.simpleOp)));\n  $('#simpleCalcA').addEventListener('input',()=>updateSimpleCalculator(document.querySelector('[data-simple-op].active')?.dataset.simpleOp||'add'));\n  $('#simpleCalcB').addEventListener('input',()=>updateSimpleCalculator(document.querySelector('[data-simple-op].active')?.dataset.simpleOp||'add'));\n  $$('[data-simple-op]').forEach(btn=>btn.addEventListener('click',()=>{ $$('[data-simple-op]').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); updateSimpleCalculator(btn.dataset.simpleOp); }));\n  addModifierRow();\n  renderQuickModifiers();"
          if old_init not in s:
              raise SystemExit('Expected calculator initialization was not found')
          s = s.replace(old_init, new_init, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit app update and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/tiny-disc-golf-rearrange-tabs.yml
          git add index.html .github/workflows/tiny-disc-golf-rearrange-tabs.yml
          git diff --cached --quiet && exit 0
          git commit -m "Rearrange Tiny Disc Golf tabs and add simple calculator"
          git push