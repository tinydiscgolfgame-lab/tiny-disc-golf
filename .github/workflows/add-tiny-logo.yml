name: Add Tiny Disc Golf Logo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add logo styling and placements
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          css='.brand{font-weight:900;letter-spacing:.08em;text-transform:uppercase}.brand-wrap{display:flex;align-items:center;gap:10px}.brand-logo{width:48px;height:48px;object-fit:contain;flex:none}.hero-logo{display:block;width:118px;height:118px;object-fit:contain;margin:0 auto 8px;position:relative;z-index:3;filter:drop-shadow(0 3px 5px rgba(20,35,30,.12))}.hero .tag{margin-top:8px}'
          if '.brand-wrap{display:flex;align-items:center' not in s:
              s=s.replace('.brand{font-weight:900;letter-spacing:.08em;text-transform:uppercase}.sub{',css+'.sub{',1)
          old='<div class="top"><div><div class="brand">Tiny Disc Golf</div><div class="sub">Player tools • your Player’s Pass saves automatically</div></div>'
          new='<div class="top"><div class="brand-wrap"><img class="brand-logo" src="tiny-disc-golf-logo.svg" alt="Tiny Disc Golf logo"><div><div class="brand">Tiny Disc Golf</div><div class="sub">Player tools • your Player’s Pass saves automatically</div></div></div>'
          if old in s:
              s=s.replace(old,new,1)
          oldhero='<div class="hero"><div class="tiny">TINY</div><div style="font-weight:900;letter-spacing:.28em;color:#51605a;margin-left:6px">DISC GOLF</div><div class="disc"></div><div class="mount"></div><div class="tag">Player’s Pass</div></div>'
          newhero='<div class="hero"><img class="hero-logo" src="tiny-disc-golf-logo.svg" alt="Tiny Disc Golf"><div class="mount"></div><div class="tag">Player’s Pass</div></div>'
          if oldhero in s:
              s=s.replace(oldhero,newhero,1)
          else:
              raise SystemExit("Expected Player Pass hero markup was not found; no changes made.")
          p.write_text(s)
          PY
      - name: Commit app update
        run: |
          git config user.name "tinydiscgolfgame-lab"
          git config user.email "tinydiscgolfgame@gmail.com"
          git add index.html
          git commit -m "Add Tiny Disc Golf professional logo to app"
          git push
      - name: Remove one-time workflow
        run: |
          rm .github/workflows/add-tiny-logo.yml
          git config user.name "tinydiscgolfgame-lab"
          git config user.email "tinydiscgolfgame@gmail.com"
          git add .github/workflows/add-tiny-logo.yml
          git commit -m "Remove one-time logo workflow"
          git push
