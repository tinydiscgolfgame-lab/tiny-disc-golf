name: Apply distance formula patch

on:
  push:
    branches: [main]
    paths: ['.distance-formula-patch-trigger']

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger distance formula patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch distance formula
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='const base=validPower&&type?getDistanceLimit(power,type.key):null;'
          new='const distanceLimit=validPower&&type?getDistanceLimit(power,type.key):null;\n    const powerComponent=distanceLimit===null?null:Math.min(power*20,distanceLimit);'
          if old not in s:
              raise SystemExit('Expected distance formula line not found')
          s=s.replace(old,new,1)
          old='else if(base===null){tee=field=\'Power outside chart\';resultClass=\'cannot-throw\'}\n    else if(!validGlide){tee=field=base+\' ft base\'}\n    else{tee=(base+glide*10)+\' ft\';field=(base+glide*5)+\' ft\'}\n    const breakdown=validPower&&type&&base!==null\n      ?\'<div class="distance-breakdown">Power × 20 component: \'+base+\' ft\'+(validGlide?\' • Drive + \'+glide+\' × 10 • Field + \'+glide+\' × 5\':\'\')+\'</div>\':\'\';'
          new='else if(distanceLimit===null){tee=field=\'Power outside chart\';resultClass=\'cannot-throw\'}\n    else if(!validGlide){tee=field=powerComponent+\' ft base\'}\n    else{tee=(powerComponent+glide*10)+\' ft\';field=(powerComponent+glide*5)+\' ft\'}\n    const breakdown=validPower&&type&&distanceLimit!==null\n      ?\'<div class="distance-breakdown">Power × 20: \'+(power*20)+\' ft • Chart Limit: \'+distanceLimit+\' ft • Applied Power Component: \'+powerComponent+\' ft\'+(validGlide?\' • Drive + \'+glide+\' × 10 • Field + \'+glide+\' × 5\':\'\')+\'</div>\':\'\';'
          if old not in s:
              raise SystemExit('Expected distance result block not found')
          s=s.replace(old,new,1)
          s=s.replace('The Distance Limit Chart supplies the Power × 20 portion of the equation. Glide is then added separately:', 'The Distance Limit Chart caps the Power × 20 portion of the equation. The Power × 20 value is calculated normally, then limited to the chart maximum for the player\'s Power and disc type. Glide is then added separately:', 1)
          s=s.replace('The chart value is the Power × 20 component only. The final distance shown for each disc adds Glide × 10 for a drive or Glide × 5 for a field throw.', 'The chart value is the maximum allowed Power × 20 component. Calculate Power × 20 normally, then use the lower of that value or the chart limit. The final distance then adds Glide × 10 for a drive or Glide × 5 for a field throw.', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply distance formula cap"
          git push
