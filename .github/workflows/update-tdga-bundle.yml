name: Update TDGA Bundle

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update bundle
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new_text='Everything Needed to Play! Includes Rulebook, Dice, Measuring Tape, Spinning Arrow &amp; Markers AND shipping for only $25! Please add your Name and Address in the comments section.'
          new_url='https://www.paypal.com/qrcodes/p2pqrc/Z7N4C8RZZGU2S'
          m=re.search(r'<section[^>]+id=["\']tdga["\'][\s\S]*?</section>',s,re.I)
          if not m:
              raise SystemExit('TDGA section not found')
          sec=m.group(0)
          sec2=re.sub(r'(<h[2-4][^>]*>\s*T(?:DGA|DA) Bundle\s*</h[2-4]>\s*<p[^>]*>).*?(</p>)',r'\1'+new_text+r'\2',sec,count=1,flags=re.I)
          if sec2==sec:
              raise SystemExit('TDA/TDGA Bundle description not found')
          sec=sec2
          sec2=re.sub(r'(<(?:a|button)[^>]*(?:href|onclick)=["\'])[^"\']*(?:["\'])',lambda x:x.group(1)+new_url+x.group(0)[-1],sec,count=1,flags=re.I)
          if sec2==sec:
              raise SystemExit('Bundle button/link not found')
          sec=sec2
          s=s[:m.start()]+sec+s[m.end():]
          p.write_text(s,encoding='utf-8')
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then echo "No changes needed"; else git add index.html && git commit -m "Update TDGA Bundle" && git push; fi
