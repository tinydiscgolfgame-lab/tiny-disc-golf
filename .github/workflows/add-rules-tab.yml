name: Add Rules tab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-rules-tab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Rules tab and content
        shell: python
        run: |
          from pathlib import Path
          from html import escape

          index = Path('index.html').read_text(encoding='utf-8')
          if 'data-tab="rules"' in index:
              raise SystemExit(0)

          rules = Path('rules-content.txt').read_text(encoding='utf-8')
          headings = {
              'Introduction', 'Player Stats', 'Disc Stats/Flight Numbers',
              'Basics of How to Play', 'Success Rolls', 'Hole Stats',
              'Course Conditions', 'Course Stats', 'Player Creation',
              'Experience or TDGA Rating', 'Stat Points', 'Rating',
              'Building Your Bag', 'Flight Numbers or Disc Stats',
              'How to Play a Hole', 'Luck', 'Typical Success Roll Modifiers',
              'Leagues and Tournaments'
          }
          pieces = []
          open_text = False
          for line in rules.splitlines():
              stripped = line.strip()
              if stripped in headings:
                  if open_text:
                      pieces.append('</div>')
                  pieces.append(f'<h2>{escape(stripped)}</h2><div class="rules-text">')
                  open_text = True
              else:
                  if not open_text:
                      pieces.append('<div class="rules-text">')
                      open_text = True
                  pieces.append(escape(line) + '\n')
          if open_text:
              pieces.append('</div>')

          rules_panel = '<section id="rules" class="panel"><div class="card rules-card"><div class="form"><div class="rules-intro"><h1>Rules</h1><p>Tiny Disc Golf rules and gameplay reference.</p></div>' + ''.join(pieces) + '</div></div></section>'

          index = index.replace(
              '.tabs{display:grid;grid-template-columns:repeat(11,1fr)',
              '.tabs{display:grid;grid-template-columns:repeat(12,1fr)',
              1
          )
          index = index.replace(
              '<button class="tab active" data-tab="pass">Player\'s Pass</button>',
              '<button class="tab active" data-tab="pass">Player\'s Pass</button><button class="tab" data-tab="rules">Rules</button>',
              1
          )
          marker = '<section id="distance" class="panel">'
          if marker not in index:
              raise RuntimeError('Distance panel marker not found')
          index = index.replace(marker, rules_panel + marker, 1)

          css = '.rules-card h1{margin:0 0 4px;font-size:1.8rem}.rules-intro p{margin:0 0 20px;color:var(--muted)}.rules-card h2{margin:22px 0 8px;text-align:left;font-size:1.05rem}.rules-text{white-space:pre-wrap;font-size:.9rem;line-height:1.55;color:var(--ink);overflow-wrap:anywhere}.rules-card .form{padding:20px}'
          index = index.replace('</style>', css + '</style>', 1)

          Path('index.html').write_text(index, encoding='utf-8')
          Path('rules-content.txt').unlink()
          Path('.github/workflows/add-rules-tab.yml').unlink()

      - name: Commit Rules tab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html rules-content.txt .github/workflows/add-rules-tab.yml
          git commit -m "Add Rules tab after Player's Pass"
          git push
