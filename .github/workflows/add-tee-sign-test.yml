name: Add First Course Tee Sign Test

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/add_tee_sign_test.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply tee sign test
        run: python scripts/add_tee_sign_test.py
      - name: Commit change if needed
        run: |
          if git diff --quiet; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add First Course Hole 1 tee sign test'
          git push
