99" font-size="20" fill="#0a293b">−10% first round; +10% after first round.</text></g><g><rect x="1620" y="725" width="740" height="485" rx="28" fill="#e9f5ee" stroke="#6ed4ff" stroke-width="5"/><rect x="1628" y="733" width="724" height="469" rx="24" fill="url(#grass)"/><text x="1650" y="785" font-size="42" font-weight="900" fill="#082a40">HOLE 6 • PAR 3 • 200 ft</text><rect x="1645" y="810" width="690" height="300" rx="18" fill="#3a7947" stroke="#a3d8a8" stroke-width="3"/><path d="M 1710 1090 Q 1970 905 2240 1025" fill="none" stroke="#fff8c7" stroke-width="12" stroke-dasharray="16 12"/><rect x="1692" y="1072" width="36" height="36" rx="5" fill="#45c8ff" stroke="#fff" stroke-width="4"/><g transform="translate(2240,1025)"><circle r="24" fill="#ffd63e" stroke="#fff" stroke-width="4"/><path d="M-18 -8 H18 M-16 0 H16 M-12 8 H12" stroke="#17364b" stroke-width="4"/></g><circle cx="2010" cy="1025" r="55" fill="#5d4935" stroke="#d4b88c" stroke-width="5"/><text x="2010" y="1035" font-size="24" fill="#fff" text-anchor="middle">TREE</text><text x="1660" y="1145" font-size="24" font-weight="900" fill="#0a293b">TREE OFF TEE</text><text x="1660" y="1175" font-size="21" fill="#0a293b">Large tree directly off the tee.</text><text x="1660" y="1199" font-size="20" fill="#0a293b">−20% modifier.</text></g><g><rect x="60" y="1240" width="740" height="485" rx="28" fill="#e9f5ee" stroke="#6ed4ff" stroke-width="5"/><rect x="68" y="1248" width="724" height="469" rx="24" fill="url(#grass)"/><text x="90" y="1300" font-size="42" font-weight="900" fill="#082a40">HOLE 7 • PAR 3 • 200 ft</text><rect x="85" y="1325" width="690" height="300" rx="18" fill="#3a7947" stroke="#a3d8a8" stroke-width="3"/><path d="M 150 1605 Q 410 1420 680 1540" fill="none" stroke="#fff8c7" stroke-width="12" stroke-dasharray="16 12"/><rect x="132" y="1587" width="36" height="36" rx="5" fill="#45c8ff" stroke="#fff" stroke-width="4"/><g transform="translate(680,1540)"><circle r="24" fill="#ffd63e" stroke="#fff" stroke-width="4"/><path d="M-18 -8 H18 M-16 0 H16 M-12 8 H12" stroke="#17364b" stroke-width="4"/></g><path d="M 410 1470 Q 460 1570 410 1630" fill="none" stroke="#ef5555" stroke-width="15" stroke-dasharray="18 12"/><text x="480" y="1500" font-size="24" fill="#ffb3b3">OB both sides</text><text x="100" y="1660" font-size="24" font-weight="900" fill="#0a293b">LEFT DOGLEG + OB</text><text x="100" y="1690" font-size="21" fill="#0a293b">Dogleg left at 150 ft, then 50 ft to basket. Fairway 100 ft wide; OB on both sides.</text><text x="100" y="1714" font-size="20" fill="#0a293b">−15% modifier.</text></g><g><rect x="840" y="1240" width="740" height="485" rx="28" fill="#e9f5ee" stroke="#6ed4ff" stroke-width="5"/><rect x="848" y="1248" width="724" height="469" rx="24" fill="url(#grass)"/><text x="870" y="1300" font-size="42" font-weight="900" fill="#082a40">HOLE 8 • PAR 3 • 200 ft</text><rect x="865" y="1325" width="690" height="300" rx="18" fill="#3a7947" stroke="#a3d8a8" stroke-width="3"/><path d="M 930 1605 Q 1190 1420 1460 1540" fill="none" stroke="#fff8c7" stroke-width="12" stroke-dasharray="16 12"/><rect x="912" y="1587" width="36" height="36" rx="5" fill="#45c8ff" stroke="#fff" stroke-width="4"/><g transform="translate(1460,1540)"><circle r="24" fill="#ffd63e" stroke="#fff" stroke-width="4"/><path d="M-18 -8 H18 M-16 0 H16 M-12 8 H12" stroke="#17364b" stroke-width="4"/></g><ellipse cx="1240" cy="1550" rx="120" ry="50" fill="#138bc2" stroke="#9be7ff" stroke-width="5"/><text x="1240" y="1560" font-size="24" fill="#fff" text-anchor="middle">30 ft POND</text><text x="880" y="1660" font-size="24" font-weight="900" fill="#0a293b">POND HAZARD</text><text x="880" y="1690" font-size="21" fill="#0a293b">30 ft pond; far edge ends 30 ft from basket. If disc lands in pond: +1 penalty and throw from near end, 60 ft from basket.</text><text x="880" y="1714" font-size="20" fill="#0a293b">−20% modifier.</text></g><g><rect x="1620" y="1240" width="740" height="485" rx="28" fill="#e9f5ee" stroke="#6ed4ff" stroke-width="5"/><rect x="1628" y="1248" width="724" height="469" rx="24" fill="url(#grass)"/><text x="1650" y="1300" font-size="42" font-weight="900" fill="#082a40">HOLE 9 • PAR 3 • 200 ft</text><rect x="1645" y="1325" width="690" height="300" rx="18" fill="#3a7947" stroke="#a3d8a8" stroke-width="3"/><path d="M 1710 1605 Q 1970 1420 2240 1540" fill="none" stroke="#fff8c7" stroke-width="12" stroke-dasharray="16 12"/><rect x="1692" y="1587" width="36" height="36" rx="5" fill="#45c8ff" stroke="#fff" stroke-width="4"/><g transform="translate(2240,1540)"><circle r="24" fill="#ffd63e" stroke="#fff" stroke-width="4"/><path d="M-18 -8 H18 M-16 0 H16 M-12 8 H12" stroke="#17364b" stroke-width="4"/></g><path d="M 2130 1475 l70 0 l0 120 l-70 0" fill="#5b554e" stroke="#ff7777" stroke-width="7"/><text x="2210" y="1460" font-size="22" fill="#ffb3b3" text-anchor="middle">OB CLIFF</text><text x="1660" y="1660" font-size="24" font-weight="900" fill="#0a293b">CLIFF BEHIND BASKET</text><text x="1660" y="1690" font-size="21" fill="#0a293b">OB cliff 20 ft behind basket. If disc goes off cliff: +1 penalty, then putt from cliff line.</text><text x="1660" y="1714" font-size="20" fill="#0a293b">No modifier.</text></g></g><text x="80" y="1780" font-family="Arial,sans-serif" font-size="25" fill="#e6f4ec">All nine holes are Par 3. Course-wide modifier: −10% on the first round; +10% on subsequent rounds.</text></svg>