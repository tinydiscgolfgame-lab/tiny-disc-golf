<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071b2c"/><stop offset="1" stop-color="#123e31"/></linearGradient><pattern id="grass" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M4 12l10 4m15 18l8-5" stroke="#3d8050" stroke-width="3" opacity=".45"/></pattern></defs><rect width="2400" height="1800" fill="url(#bg)"/><text x="80" y="100" font-family="Arial,sans-serif" font-size="70" font-weight="900" fill="#fff">FIRST COURSE — HOLE-BY-HOLE MAPS</text><text x="80" y="160" font-family="Arial,sans-serif" font-size="32" fill="#77d9ff">Accurate distances and hazards from the Tiny Disc Golf app</text><g id="cards" font-family="Arial,sans-serif"><g><rect x="60" y="210" width="740" height="485" rx="28" fill="#e9f5ee" stroke="#6ed4ff" stroke-width="5"/><rect x="68" y="218" width="724" height="469" rx="24" fill="url(#grass)"/><text x="90" y="270" font-size="42" font-weight="900" fill="#082a40">HOLE 1 • PAR 3 • 100 ft</text><rect x="85" y="295" width="690" height="300" rx="18" fill="#3a7947" stroke="#a3d8a8" stroke-width="3"/><path d="M 150 575 Q 410 390 680 510" fill="none" stroke="#fff8c7" stroke-width="12" stroke-dasharray="16 12"/><rect x="132" y="557" width="36" height="36" rx="5" fill="#45c8ff" stroke="#fff" stroke-width="4"/><g transform="translate(680,510)"><circle r="24" fill="#ffd63e" stroke="#fff" stroke-width="4"/><path d="M-18 -8 H18 M-16 0 H16 M-12 8 H12" stroke="#17364b" stroke-width="4"/></g><text x="100" y="630" font-size="24" font-weight="900" fill="#0a293b">OPEN HOLE</text><text x="100" y="660" font-size="21" fill="#0a293b">No obstacles, mandos, or hazards.</text><text x="100" y="684" font-size="20" fill="#0a293b">−10% first round; +10% after first round.</text></g><g><rect x="840" y="210" width="740" height="485" rx="28" fill="#e9f5ee" stroke="#6ed4ff" stroke-width="5"/><rect x="848" y="218" width="724" height="469" rx="24" fill="url(#gras