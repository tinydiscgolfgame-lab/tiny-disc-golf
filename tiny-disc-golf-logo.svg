<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">Tiny Disc Golf</title><desc id="desc">A clean, professional disc golf emblem featuring a flying disc and basket.</desc>
<defs><linearGradient id="disc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d8872"/><stop offset="1" stop-color="#173f3a"/></linearGradient></defs>
<circle cx="300" cy="300" r="278" fill="#f5f3ec" stroke="#173f3a" stroke-width="15"/>
<circle cx="300" cy="300" r="258" fill="none" stroke="#9ba99f" stroke-width="2"/>
<path d="M105 238 Q300 170 495 238" fill="none" stroke="#9ba99f" stroke-width="3"/>
<!-- Flying disc -->
<g transform="rotate(-17 300 190)">
 <ellipse cx="300" cy="190" rx="138" ry="39" fill="url(#disc)" stroke="#173f3a" stroke-width="5"/>
 <ellipse cx="300" cy="183" rx="112" ry="23" fill="none" stroke="#dce6dc" stroke-width="3" opacity=".9"/>
 <path d="M174 193 Q300 229 426 193" fill="none" stroke="#dce6dc" stroke-width="3" opacity=".8"/>
</g>
<!-- Basket silhouette -->
<g fill="none" stroke="#173f3a" stroke-linecap="round" stroke-linejoin="round">
 <path d="M260 255 L270 365 M340 255 L330 365" stroke-width="10"/>
 <path d="M254 274 H346 M258 290 H342" stroke-width="7"/>
 <path d="M258 290 L278 326 M278 290 L290 328 M300 290 V330 M322 290 L310 328 M342 290 L322 326" stroke-width="5"/>
 <path d="M250 329 Q300 345 350 329 L360 354 Q300 377 240 354Z" fill="#2f6b58" stroke-width="6"/>
 <path d="M270 365 L265 384 M330 365 L335 384 M258 386 H342" stroke-width="9"/>
</g>
<path d="M125 400 Q300 365 475 400" fill="none" stroke="#b2c957" stroke-width="6" stroke-linecap="round"/>
<text x="300" y="455" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="900" letter-spacing="5" fill="#173f3a">TINY</text>
<text x="300" y="497" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" letter-spacing="8" fill="#2f6b58">DISC GOLF</text>
<path d="M190 520 H270 M330 520 H410" stroke="#173f3a" stroke-width="4" stroke-linecap="round"/>
<circle cx="300" cy="520" r="5" fill="#b2c957"/>
</svg>